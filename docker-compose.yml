version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chimeraflow-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set (e.g. via Doppler)}
      - DATA_DIR=/data
    volumes:
      - ./data:/data:ro  # Read-only mount for synthetic data
      - ./backend:/app
    depends_on:
      - redis
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: chimeraflow-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  default:
    name: chimeraflow-network
