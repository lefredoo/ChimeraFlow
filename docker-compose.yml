services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Synthetic data baked in the image (the runtime stage reads this named context)
      additional_contexts:
        data: ./data
    container_name: chimeraflow-api
    ports:
      - "8000:8000"
    environment:
      - BACKEND_NODE_ENV=production
      - BACKEND_PORT=8000
      - BACKEND_LOG_LEVEL=INFO
      - ACCESS_READER=mdbtools
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      # The password must be URL-safe (e.g. `openssl rand -hex 24`): it is embedded in the URL
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set (e.g. via Doppler)}@redis:6379/0
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set (e.g. via Doppler)}
      - DATA_DIR=/data
      - RATE_LIMIT_PER_IP=${RATE_LIMIT_PER_IP:?RATE_LIMIT_PER_IP must be set (e.g. via Doppler)}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:?RATE_LIMIT_WINDOW_SECONDS must be set (e.g. via Doppler)}
      # Demo account authentication (required: the API refuses to start without them)
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET must be set (e.g. via Doppler)}
      - DEMO_LOGIN_EMAIL=${DEMO_LOGIN_EMAIL:?DEMO_LOGIN_EMAIL must be set (e.g. via Doppler)}
      # The hash contains no `$`, so it needs no escaping (python -m auth.hash_password)
      - DEMO_LOGIN_PASSWORD_HASH=${DEMO_LOGIN_PASSWORD_HASH:?DEMO_LOGIN_PASSWORD_HASH must be set (e.g. via Doppler)}
      # Optional: trusted proxies (Traefik) and NL->rule conversion; unset variables stay unset
      - TRUSTED_PROXIES
      - RATE_LIMIT_NL_PER_IP
      - RATE_LIMIT_LOGIN_PER_IP
      - LITELLM_API_KEY
      - LITELLM_BASE_URL
      - LITELLM_MODEL
      - LITELLM_FALLBACK_MODEL
      - LITELLM_BUDGET_USD
      - CF_EMAIL_ACCOUNT_ID
      - CF_EMAIL_API_TOKEN
      - ALERT_EMAIL_FROM
      - ALERT_EMAIL_TO
      - ALERT_EMAIL_COOLDOWN_SECONDS
    volumes:
      # Read-only mount of the synthetic data: edits show up without a rebuild. It
      # shadows the copy baked in the image (the code in /app comes from the image).
      - ./data:/data:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # ~105 MiB at idle, ~275 MiB once litellm is imported (first NL->rule call)
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: chimeraflow-redis
    user: redis
    # No published port: only containers of this network reach Redis.
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set (e.g. via Doppler)}
      # Read by redis-cli (healthcheck) so the password is not on its command line
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    # noeviction: the LLM budget counter (chimeraflow:nl:spent_microusd) has no TTL and an
    # eviction would reset the budget. At the memory limit writes fail, which the API
    # turns into a refusal (503), never into an unlimited budget.
    # appendonly: counters survive a restart (volume redis-data).
    command:
      - sh
      - -c
      - exec redis-server --maxmemory 100mb --maxmemory-policy noeviction --appendonly yes --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  redis-data:

networks:
  default:
    name: chimeraflow-network
