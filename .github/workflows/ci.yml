name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install mdbtools
        run: sudo apt-get update && sudo apt-get install -y mdbtools

      - name: Lint
        working-directory: backend
        run: python -m ruff check .

      - name: Test
        working-directory: backend
        run: python -m pytest tests -q --hypothesis-profile=ci

  backend-docker-test:
    name: Backend Docker test stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build test image
        run: docker build --target test -t chimeraflow-backend-test backend

      - name: Run test image
        run: docker run --rm -v "${{ github.workspace }}/data:/data:ro" chimeraflow-backend-test

  migrations-postgres:
    name: Alembic migrations on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BACKEND_NODE_ENV: test
      CORS_ORIGINS: http://localhost:3000
      DATA_DIR: ../data
      REDIS_URL: redis://localhost:6379/0
      ACCESS_READER: access-parser
      RATE_LIMIT_PER_IP: "10"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      # Throwaway values: config import validates the format, nothing authenticates here
      AUTH_TOKEN_SECRET: ci-only-secret-0123456789abcdef-0123456789abcdef
      DEMO_LOGIN_EMAIL: ci@example.test
      DEMO_LOGIN_PASSWORD_HASH: scrypt:32768:8:1:AAAAAAAAAAAAAAAAAAAAAA:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Upgrade to head
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Check models match migrations
        working-directory: backend
        run: python -m alembic check

      - name: Downgrade to base
        working-directory: backend
        run: python -m alembic downgrade base

      - name: Offline SQL generation
        working-directory: backend
        run: python -m alembic upgrade head --sql > /dev/null

  frontend-lint-test-build:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Harmless build-time values: they are public by design and nothing connects to them
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEMO_LOGIN_EMAIL: ci@example.test
      NEXT_PUBLIC_DEMO_LOGIN_PASSWORD: ci-not-a-real-password
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned binary with checksum: no third-party action code runs with repository access
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan full history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
