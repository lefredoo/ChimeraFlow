[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    redis: integration test against a real Redis, run only when REDIS_TEST_URL is set
# Hypothesis profiles are registered in tests/conftest.py; use
# --hypothesis-profile=ci to override
addopts = --hypothesis-profile=dev
